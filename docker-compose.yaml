services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: phaxa
      POSTGRES_USER: phaxa
      POSTGRES_PASSWORD: phaxa_secret
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U phaxa"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  temporal:
    image: temporalio/auto-setup:1.24
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=phaxa
      - POSTGRES_PWD=phaxa_secret
      - POSTGRES_SEEDS=postgres
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development-sql.yaml
    ports:
      - "7233:7233"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./temporal-config:/etc/temporal/config/dynamicconfig

  temporal-ui:
    image: temporalio/ui:2.26.2
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost
    ports:
      - "8088:8080"
    depends_on:
      - temporal

  server:
    build:
      context: .
      args:
        CMD: server
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://phaxa:phaxa_secret@postgres:5432/phaxa?sslmode=disable
      REDIS_URL: redis://redis:6379
      TEMPORAL_ADDRESS: temporal:7233
      CORS_ORIGINS: http://localhost
      # Override these in .env — do NOT use these defaults in production.
      JWT_SECRET: dev-insecure-secret-change-in-prod
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: admin
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    # Server is internal only — access via the frontend nginx proxy.
    # Uncomment the line below only for direct API debugging.
    # ports:
    #   - "8080:8080"

  worker:
    build:
      context: .
      args:
        CMD: worker
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://phaxa:phaxa_secret@postgres:5432/phaxa?sslmode=disable
      REDIS_URL: redis://redis:6379
      TEMPORAL_ADDRESS: temporal:7233
      EXECUTOR_MODE: temporal
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_started
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - server
    restart: unless-stopped

volumes:
  postgres_data:
