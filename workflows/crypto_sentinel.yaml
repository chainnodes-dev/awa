metadata:
  name: crypto-sentinel
  description: "Non-stop agentic trading sentinel. Monitors BTC/ETH prices and sentiment every 2 hours."
  version: "1.0.0"
  tags: ["trading", "sentinel", "crypto"]

blackboard:
  schema:
    recommendation:
      type: "string"
      description: "The action to take: BUY, SELL, or HOLD"
    confidence_score:
      type: "number"
      description: "Analyst confidence from 0 to 1"
    rationale:
      type: "string"
      description: "The reasoning behind the recommendation"
    should_alert:
      type: "boolean"
      description: "Internal flag to trigger user notification"
    target_price:
      type: "string"
      description: "Optimal entry/exit point"

states:
  - name: init
    type: initial
    to_nodes: ["idle_pulse"]
  - name: idle_pulse
    type: wait
    wait_time: 7200
    to_nodes: ["market_check"]

  - name: market_check
    type: intermediate
    agent: sentinel_analyst
    instructions: |
      Perform a market pulse check on BTC and ETH.
      1. Fetch current prices and 24h change using CoinGecko.
      2. Fetch latest news and community sentiment using Brave Search.
      3. Determine if a high-conviction trade exists.
    to_nodes: ["decide_action"]

  - name: decide_action
    type: script
    script:
      updates:
        should_alert: "bb.recommendation != 'HOLD' && bb.confidence_score >= 0.75"
      trigger: "bb.should_alert ? 'alert' : 'sleep'"
    transitions:
      - trigger: "alert"
        to: "notify_user"
      - trigger: "sleep"
        to: "idle_pulse"


  - name: notify_user
    type: hitl
    instructions: |
      🚨 TRADE ALERT: {{bb.recommendation}}
      Confidence: {{bb.confidence_score}}
      Rationale: {{bb.rationale}}
      Target: {{bb.target_price}}
    to_nodes: ["idle_pulse"]

agents:
  - name: sentinel_analyst
    model: deepseek-v4-flash
    prompt_template: "You are a crypto market analyst. Decide if we should BUY, SELL, or HOLD based on current price and sentiment data."
