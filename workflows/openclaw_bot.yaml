apiVersion: phaxa/v1
kind: Workflow

metadata:
  name: openclaw-bot
  description: "An OpenClaw-style autonomous assistant triggered natively by Telegram, with conversation history memory."
  version: "1.0.0"

triggers:
  - name: telegram-inbound
    type: telegram
    config:
      bot_token_env: "TELEGRAM_BOT_TOKEN"

blackboard:
  schema:
    chat_id:
      type: string
      required: true
    message_text:
      type: string
      required: true
    username:
      type: string
    agent_reply:
      type: string

states:
  - name: INTAKE
    type: initial
    to: PROCESS_REQUEST

  - name: PROCESS_REQUEST
    type: prompt
    agent: claw_agent
    instructions: |
      You are OpenClaw, an autonomous, always-on AI assistant running on Phaxa.
      
      The user "{{bb.username}}" sent you the following message in chat "{{bb.chat_id}}":
      "{{bb.message_text}}"
      
      YOUR INSTRUCTIONS:
      1. Load the conversation history for this chat from the file "conversations/{{bb.chat_id}}.json" (using the filesystem tool).
         - Note: If the file does not exist, initialize a new conversation history.
      2. Analyze the conversation history and the new message.
      3. If the user asks you to perform system tasks (e.g. read files, write files, search the web, run scripts), use your MCP tools to execute them.
      4. Draft your response to the user.
      5. Append the user's message and your response to the chat history.
      6. Save the updated chat history back to "conversations/{{bb.chat_id}}.json" (using the filesystem tool).
      7. Write your response text into the blackboard field 'agent_reply'.
      8. Return the trigger 'done'.

  - name: SEND_REPLY
    type: telegram_output
    telegram_output:
      chat_id: "{{bb.chat_id}}"
      message_text: "{{bb.agent_reply}}"

  - name: COMPLETED
    type: terminal

transitions:
  - from: PROCESS_REQUEST
    to: SEND_REPLY
    trigger: done

  - from: SEND_REPLY
    to: COMPLETED
    trigger: sent

agents:
  - name: claw_agent
    model: claude-3-5-sonnet
    config:
      prompt: "You are an advanced, helpful, and autonomous assistant with access to local tools."
      mcp_servers: "filesystem, brave-search, puppeteer"
