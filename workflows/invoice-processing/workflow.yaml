apiVersion: phaxa/v1
kind: Workflow

metadata:
  name: invoice-processing
  version: "1.0.0"
  description: "End-to-end accounts payable invoice workflow"

blackboard:
  schema:
    invoice_id:
      type: string
      required: true
    amount:
      type: number
      required: true
    vendor_id:
      type: string
      required: true
    vendor_name:
      type: string
    validated:
      type: bool
      default: false
    validation_notes:
      type: string
    approval_user:
      type: string
    rejection_reason:
      type: string
    erp_entry_id:
      type: string

states:
  - name: RECEIVED
    type: initial
    agent: intake_agent
    position:
      x: 400
      y: 50

  - name: VALIDATING
    type: prompt
    agent: qa_validator_agent
    timeout: 30m
    on_timeout: timeout
    position:
      x: 400
      y: 200

  - name: AWAITING_APPROVAL
    type: hitl
    timeout: 24h
    on_timeout: timeout
    assignee: finance_team
    position:
      x: 400
      y: 350

  - name: PROCESSING
    type: prompt
    agent: erp_agent
    position:
      x: 400
      y: 500

  - name: COMPLETE
    type: terminal
    position:
      x: 400
      y: 650

  - name: FAILED
    type: terminal
    position:
      x: 700
      y: 400

transitions:
  - from: RECEIVED
    to: VALIDATING
    trigger: intake_complete
    guard: "invoice_id != '' && amount > 0"

  - from: VALIDATING
    to: AWAITING_APPROVAL
    trigger: validation_passed
    guard: "validated == true"

  - from: VALIDATING
    to: FAILED
    trigger: validation_failed

  - from: VALIDATING
    to: FAILED
    trigger: timeout

  - from: AWAITING_APPROVAL
    to: PROCESSING
    trigger: human_approved

  - from: AWAITING_APPROVAL
    to: FAILED
    trigger: human_rejected

  - from: AWAITING_APPROVAL
    to: FAILED
    trigger: timeout

  - from: PROCESSING
    to: COMPLETE
    trigger: erp_write_complete

  - from: PROCESSING
    to: FAILED
    trigger: erp_write_failed

agents:
  - name: intake_agent
    model: "{{ .Env.DEFAULT_MODEL }}"
    tools: []
    prompt_template: workflows/invoice-processing/prompts/intake.md

  - name: qa_validator_agent
    model: "{{ .Env.DEFAULT_MODEL }}"
    tools: []
    prompt_template: workflows/invoice-processing/prompts/qa_validator.md
    rules:
      - "amount must be greater than 0"
      - "invoice_id must be non-empty"
      - "vendor_id must be non-empty"

  - name: erp_agent
    model: "{{ .Env.DEFAULT_MODEL }}"
    tools: []
    prompt_template: workflows/invoice-processing/prompts/erp_agent.md
