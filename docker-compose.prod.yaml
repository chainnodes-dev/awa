# Phaxa Production Stack
# Usage: docker compose -f docker-compose.prod.yaml up -d

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-phaxa}
      POSTGRES_USER: ${DB_USER:-phaxa}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-phaxa_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis:7-alpine
    restart: always

  temporal:
    image: temporalio/auto-setup:1.24
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=${DB_USER:-phaxa}
      - POSTGRES_PWD=${DB_PASSWORD:-phaxa_secret}
      - POSTGRES_SEEDS=postgres
    depends_on:
      - postgres
    restart: always

  server:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-bauhaus28}/phaxa-server:latest
    environment:
      DATABASE_URL: postgres://${DB_USER:-phaxa}:${DB_PASSWORD:-phaxa_secret}@postgres:5432/${DB_NAME:-phaxa}?sslmode=disable
      REDIS_URL: redis://redis:6379
      TEMPORAL_ADDRESS: temporal:7233
    depends_on:
      - postgres
      - redis
    restart: always

  worker:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-bauhaus28}/phaxa-worker:latest
    environment:
      DATABASE_URL: postgres://${DB_USER:-phaxa}:${DB_PASSWORD:-phaxa_secret}@postgres:5432/${DB_NAME:-phaxa}?sslmode=disable
      REDIS_URL: redis://redis:6379
      TEMPORAL_ADDRESS: temporal:7233
      EXECUTOR_MODE: temporal
    depends_on:
      - postgres
      - temporal
    restart: always

  frontend:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-bauhaus28}/phaxa-frontend:latest
    ports:
      - "${PORT:-80}:80"
    depends_on:
      - server
    restart: always

volumes:
  postgres_data:
