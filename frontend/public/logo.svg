<svg width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer Glow -->
  <circle cx="200" cy="200" r="180" fill="url(#outer_glow)" opacity="0.3"/>
  
  <!-- Main Orb -->
  <circle cx="200" cy="200" r="150" stroke="url(#main_grad)" stroke-width="8" stroke-linecap="round"/>
  
  <!-- Geometric Internal Structure -->
  <path d="M200 50 L350 200 L200 350 L50 200 Z" stroke="url(#accent_grad)" stroke-width="4" stroke-linejoin="round" opacity="0.8"/>
  <path d="M200 50 V350 M50 200 H350" stroke="url(#accent_grad)" stroke-width="2" opacity="0.4"/>
  
  <!-- Central Core -->
  <circle cx="200" cy="200" r="40" fill="url(#core_grad)">
    <animate attributeName="r" values="38;42;38" dur="4s" repeatCount="indefinite" />
  </circle>
  
  <defs>
    <radialGradient id="outer_glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(200 200) rotate(90) scale(180)">
      <stop stop-color="#A855F7"/>
      <stop offset="1" stop-color="#A855F7" stop-opacity="0"/>
    </radialGradient>
    
    <linearGradient id="main_grad" x1="50" y1="50" x2="350" y2="350" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A855F7"/>
      <stop offset="1" stop-color="#EC4899"/>
    </linearGradient>
    
    <linearGradient id="accent_grad" x1="350" y1="50" x2="50" y2="350" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#A855F7"/>
    </linearGradient>
    
    <radialGradient id="core_grad" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(200 200) rotate(90) scale(40)">
      <stop stop-color="white"/>
      <stop offset="0.4" stop-color="#A855F7"/>
      <stop offset="1" stop-color="#6B21A8"/>
    </radialGradient>
  </defs>
</svg>
