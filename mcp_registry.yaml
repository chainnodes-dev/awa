# MCP Server Registry
# Maps logical server names to environment variable keys and descriptions.
#
# To add a new server:
#   1. Add an entry here with a unique name, the env var key, and a description.
#   2. Set the env var in your .env file or deployment config.

mcp_servers:
  # ── Search & Knowledge ──────────────────────────────────────────────
  - name: brave-search
    category: Search
    icon: search
    author: Model Context Protocol
    transport: stdio
    command: npx
    args: ["-y", "@modelcontextprotocol/server-brave-search"]
    env_var: BRAVE_API_KEY
    description: "High-quality, private web search for real-time information."
    doc_url: "https://github.com/modelcontextprotocol/servers/tree/main/src/brave-search"

  - name: wikipedia
    category: Knowledge
    icon: book
    author: Model Context Protocol
    transport: stdio
    command: npx
    args: ["-y", "wikipedia-mcp"]
    description: "Search and retrieve full-text articles from Wikipedia."
    doc_url: "https://github.com/modelcontextprotocol/servers/tree/main/src/wikipedia"

  # ── Productivity ────────────────────────────────────────────────────
  - name: notion
    category: Productivity
    icon: book-open
    author: Notion
    transport: stdio
    command: npx
    args: ["-y", "@notionhq/notion-mcp-server"]
    env_var: NOTION_API_KEY
    description: "Access and manage Notion pages, databases, and blocks."
    doc_url: "https://github.com/notionhq/notion-mcp-server"

  - name: linear
    category: Productivity
    icon: check-square
    author: Linear
    transport: stdio
    command: npx
    args: ["-y", "mcp-linear"]
    env_var: LINEAR_API_KEY
    description: "Manage issues and projects in Linear."
    doc_url: "https://github.com/linear/mcp-linear"

  - name: airtable
    category: Productivity
    icon: grid
    author: Airtable
    transport: stdio
    command: npx
    args: ["-y", "airtable-mcp-server"]
    env_var: AIRTABLE_API_KEY
    description: "Read and write data to Airtable bases."
    doc_url: "https://github.com/modelcontextprotocol/servers/tree/main/src/airtable"

  # ── Development ─────────────────────────────────────────────────────
  - name: github
    category: Development
    icon: github
    author: Model Context Protocol
    transport: stdio
    command: npx
    args: ["-y", "@modelcontextprotocol/server-github"]
    env_var: GITHUB_PERSONAL_ACCESS_TOKEN
    description: "Automate GitHub tasks: PRs, issues, and code search."
    doc_url: "https://github.com/modelcontextprotocol/servers/tree/main/src/github"

  - name: everything
    category: Development
    icon: cpu
    author: Model Context Protocol
    transport: stdio
    command: npx
    args: ["-y", "@modelcontextprotocol/server-everything"]
    description: "Anthropic's official capability test server showcasing all MCP features."
    doc_url: "https://github.com/modelcontextprotocol/servers/tree/main/src/everything"

  # ── Infrastructure & Databases ──────────────────────────────────────
  - name: postgres
    category: Databases
    icon: database
    author: Model Context Protocol
    transport: stdio
    command: npx
    args: ["-y", "@modelcontextprotocol/server-postgres"]
    env_var: DATABASE_URL
    description: "Connect to and query PostgreSQL databases."
    doc_url: "https://github.com/modelcontextprotocol/servers/tree/main/src/postgres"

  - name: redis
    category: Databases
    icon: database
    author: Model Context Protocol
    transport: stdio
    command: npx
    args: ["-y", "@modelcontextprotocol/server-redis"]
    env_var: REDIS_URL
    description: "Interact with Redis key-value stores."
    doc_url: "https://github.com/modelcontextprotocol/servers/tree/main/src/redis"

  # ── Communication ───────────────────────────────────────────────────
  - name: slack
    category: Communication
    icon: message-square
    author: Model Context Protocol
    transport: stdio
    command: npx
    args: ["-y", "@modelcontextprotocol/server-slack"]
    env_var: SLACK_BOT_TOKEN
    description: "Send messages, list channels, and interact with Slack workspaces."
    doc_url: "https://github.com/modelcontextprotocol/servers/tree/main/src/slack"

  # ── Utilities ──────────────────────────────────────────────────────
  - name: fetch
    category: Utilities
    icon: globe
    author: InfoInlet
    transport: stdio
    command: npx
    args: ["-y", "@infoinlet/mcp-fetch"]
    description: "Download web content safely and convert it to Markdown."
    doc_url: "https://github.com/infoinlet/mcp-fetch"

  - name: filesystem
    category: Utilities
    icon: file-text
    author: Model Context Protocol
    transport: stdio
    command: npx
    args: ["-y", "@modelcontextprotocol/server-filesystem", "./data"]
    description: "Access local files (restricted to ./data)."

  # ── Enterprise ──────────────────────────────────────────────────────
  - name: sap-fiori
    category: Enterprise
    icon: layout
    author: SAP
    transport: stdio
    command: npx
    args: ["-y", "@sap-ux/fiori-mcp-server"]
    description: "Tooling for developing and modifying SAP Fiori applications."

  # ── Finance ─────────────────────────────────────────────────────────
  - name: openfigi
    category: Finance
    icon: trending-up
    author: Local
    transport: sse
    url: "http://localhost:8093"
    env_var: OPENFIGI_API_KEY
    description: "Lookup the Financial Instrument Global Identifier (FIGI) for a stock ticker."

  - name: lei
    category: Finance
    icon: award
    author: Local
    transport: sse
    url: "http://localhost:8091"
    description: "Search for a company's Legal Entity Identifier (LEI) and official details."

  - name: sec-edgar
    category: Finance
    icon: file-search
    author: Cyanheads
    transport: stdio
    command: npx
    args: ["-y", "@cyanheads/secedgar-mcp-server"]
    env_var: EDGAR_USER_AGENT
    description: "Search and retrieve official SEC filings, company facts, and financial facts from SEC EDGAR."
    doc_url: "https://www.npmjs.com/package/@cyanheads/secedgar-mcp-server"
